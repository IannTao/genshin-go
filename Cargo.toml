[package]
name = "nsh-app-genshin-go"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lints]
workspace = true

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcodegen = "1.8"
chrono = { version = "0.4", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_WindowsProgramming",
] }
md5 = "0.8"
futures-util = "0.3"
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
zstd = "0.14"
azure_core = { version = "1.1", default-features = false }
async-trait = "0.1"
uigf-mihoyo = { git = "https://github.com/UIGF-org/mihoyo-api-sdk", rev = "7c3107f95b72e7324af966b2e8989eb8375e5fc7" }
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
url = "2"
rusqlite = { version = "0.38", features = ["bundled"] }


[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# 核心正确性，直接 deny
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# 风格与性能，warn 即可（CI 会提升为 error）
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# Pedantic 选择性启用，不要全开
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"                 # 覆盖 pedantic 中的个别噪声规则
missing_panics_doc = "allow"

# Restriction 组手动挑选，严禁整组开启
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

  <main id="root"></main>
  <script>
  const icon=(name)=>`<svg class="icon" aria-hidden="true"><use href="#${name}"></use></svg>`;
  const variants={A:'沉浸式启动页',B:'任务控制台',C:'资料与启动分栏'};
  const tabs=['活动','公告','资讯'];
  const nav=[['home','首页'],['user','账号'],['folder','游戏目录'],['gift','签到'],['chart','祈愿记录'],['spark','养成计划'],['settings','设置']];
  const state={variant:variants[new URLSearchParams(location.search).get('variant')]?new URLSearchParams(location.search).get('variant'):'A',tab:'活动',section:'首页',account:'旅行者 01',directory:'C:\\Games\\Genshin Impact\\Genshin Impact Game',sign:'待签到',message:'',modal:''};
  const escapeHtml=(value)=>String(value).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function setVariant(key){state.variant=key;const u=new URL(location.href);u.searchParams.set('variant',key);history.replaceState(null,'',u);render()}
  function cycle(direction){const keys=Object.keys(variants);setVariant(keys[(keys.indexOf(state.variant)+direction+keys.length)%keys.length])}
  function notify(message){state.message=message;render();clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>{state.message='';render()},3200)}
  function action(name){if(name==='账号'){state.modal='account'}else if(name==='游戏目录'){state.modal='directory'}else if(name==='签到'){state.sign='已签到';notify('演示：签到状态已更新为“已签到”');return}else if(name==='启动'){notify('演示：普通启动入口。此原型不会启动游戏。');return}else if(name==='公告'){state.tab='公告'}else if(name==='资讯'){state.tab='资讯'}else if(name==='活动'){state.tab='活动'}else{state.section=name;notify(`“${name}”是后续功能的界面入口示意`);return}render()}
  function rail(){return `<aside class="rail" aria-label="主导航"><div class="rail-logo">✦</div>${nav.map(([i,label])=>`<button class="${state.section===label?'active':''}" data-action="${label}" aria-label="${label}" title="${label}">${icon(i)}<span class="label">${label}</span></button>`).join('')}<div class="rail-spacer"></div><button class="avatar" data-action="账号" aria-label="账号">${icon('user')}</button></aside>`}
  function cosmos(){return `<svg class="cosmos" viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="planet"><stop stop-color="#bbc8ff"/><stop offset=".48" stop-color="#5764bf"/><stop offset="1" stop-color="#192d6d"/></radialGradient><linearGradient id="ribbon"><stop stop-color="#e9fcff"/><stop offset=".47" stop-color="#87bfff"/><stop offset="1" stop-color="#5449b6"/></linearGradient></defs><circle class="orbit" cx="560" cy="465" r="333"/><circle class="orbit2" cx="560" cy="465" r="390"/><circle class="orbit2" cx="560" cy="465" r="255"/><circle class="planet" cx="780" cy="420" r="258"/><path d="M160 740 Q420 550 880 760" fill="none" stroke="url(#ribbon)" stroke-width="95" opacity=".8"/><path d="M100 720 Q410 495 920 725" fill="none" stroke="#d9e8ff" stroke-width="5" opacity=".8"/><path d="M360 140 Q550 390 770 120" fill="none" stroke="url(#ribbon)" stroke-width="98" opacity=".6"/><path class="streak" d="M130 850 985 273M170 894 990 350"/><path class="figure" d="M651 261Q689 174 799 178q108 16 137 113l-38 8q-14-51-61-64 46 73 15 129-26 39-84 51l-33 44-48-45q-69-22-86-90-18-61 50-63z"/><path d="M639 286q80-116 205-71M660 310q100-65 210-34" fill="none" stroke="#f4f6ff" stroke-width="27" opacity=".8" stroke-linecap="round"/><circle cx="729" cy="310" r="11" fill="#8669dc"/><circle cx="839" cy="311" r="11" fill="#8669dc"/><path d="M774 344q21 18 39-1" fill="none" stroke="#805b9d" stroke-width="4"/><path class="figure" d="M711 455q89-78 184-8l79 295q-116 48-290 12l-8-200z"/><path d="M741 508q92 68 153-14M696 590q101 45 242-11" fill="none" stroke="#fff" stroke-width="8" opacity=".8"/><path d="M505 506q54-52 109-7l-15 140-99 12z" fill="#3d4e9e" stroke="#aad8ff" stroke-width="5"/><circle cx="570" cy="510" r="29" fill="#e4ddff"/><path d="M547 483q22-48 52 3" fill="none" stroke="#bccfff" stroke-width="20"/><path d="M548 538q-23 89-80 129m106-123q7 82 64 143" fill="none" stroke="#9296e4" stroke-width="31"/><path class="star" d="m260 235 17 58 55 18-55 18-17 58-18-58-56-18 56-18z"/><path class="star-blue" d="m880 80 11 39 38 11-38 12-11 38-12-38-38-12 38-11z"/><path class="star" d="m420 773 9 31 30 9-30 10-9 30-10-30-31-10 31-9z"/><g fill="#c8d9ff"><circle cx="390" cy="170" r="4"/><circle cx="477" cy="260" r="3"/><circle cx="334" cy="510" r="4"/><circle cx="925" cy="570" r="3"/><circle cx="310" cy="694" r="3"/><circle cx="600" cy="90" r="3"/></g></svg>`}
  function news(){const lines={活动:['「星海漫游」主题活动现已开启','旅途纪事 · 新一期挑战开放'],公告:['版本更新说明与已知问题','客户端维护时间提醒'],资讯:['开发者笔记：新的旅途','社区创作精选']};return `<section class="glass" aria-label="资讯卡片"><div class="news-art"><strong>旅途纪事</strong><span>JOURNEY NOTES · 07</span></div><div class="news-tabs">${tabs.map(t=>`<button class="${state.tab===t?'active':''}" data-action="${t}">${t}</button>`).join('')}</div><div class="news-lines">${lines[state.tab].map((item,i)=>`<button data-action="${state.tab}"><span>【${state.tab}】${item}</span><small>${i?'11/04':'11/17'}</small></button>`).join('')}</div></section>`}
  function variantA(){return `<div class="app variant-a"><div class="a-art">${cosmos()}</div><div class="a-wash"></div>${rail()}<header class="a-top"><span class="pill" style="background:#768b9c9c;color:white">✦ &nbsp; Genshin-Go 原型</span><div class="a-top-actions"><button data-action="设置" aria-label="设置">⚙</button></div></header><div class="a-brand">✦ 原神</div><div class="a-body"><div class="a-hero"><div class="eyebrow">A WORLD TO EXPLORE</div><h1>启程，向星海</h1><p>你的旅途，从这里继续</p></div><div class="a-left">${news()}<section class="glass a-checkin"><div class="row space"><strong>每日签到</strong><span class="pill" style="background:#ffffff27">${state.sign}</span></div><p class="muted">指定账号：${escapeHtml(state.account)} · 仅演示状态</p><button class="check-action" data-action="签到">${state.sign==='已签到'?'今日已签到':'立即签到'}</button></section></div><div class="a-status"><strong>国服官服 · 默认目录</strong><span class="small">${escapeHtml(state.directory)}</span></div><button class="primary a-launch" data-action="启动">${icon('play')} 普通启动游戏</button></div><div class="a-side-tools"><button data-action="公告" aria-label="公告">${icon('bell')}</button><button data-action="游戏目录" aria-label="游戏目录">${icon('folder')}</button><button data-action="设置" aria-label="设置">${icon('settings')}</button></div></div>`}
  function variantB(){return `<div class="app variant-b"><aside class="b-sidebar"><div class="b-brand">✦ Genshin-Go</div>${nav.map(([i,label])=>`<button data-action="${label}" class="${state.section===label?'active':''}">${icon(i)}<span>${label}</span></button>`).join('')}<div class="sidebar-bottom">Windows · 国服官服<br>界面原型 / 本地演示</div></aside><div class="b-main"><header class="b-head"><div><div class="eyebrow" style="color:#5885a7">LAUNCHER OVERVIEW</div><h1>欢迎回来，旅行者</h1></div><span class="pill"> <i class="dot"></i> 界面演示</span></header><div class="b-grid"><section class="b-card b-game"><div class="eyebrow">GENSHIN IMPACT · CN OFFICIAL</div><h2>原神</h2><p>已选择游戏目录，可以从这里开始旅途。</p><button class="primary" data-action="启动">${icon('play')} 普通启动游戏</button><p class="small" style="opacity:.7;margin-top:15px">原型仅展示入口，不会实际启动</p></section><div class="b-info"><section class="b-card"><div class="row space"><h2 class="panel-title">当前账号</h2>${icon('user')}</div><div class="b-account"><div class="profile">旅</div><div><strong>${escapeHtml(state.account)}</strong><div class="meta">米哈游账号 · 演示身份</div></div></div><div class="divider"></div><button class="link" data-action="账号">管理账号与扫码授权 →</button></section><section class="b-card"><div class="row space"><h2 class="panel-title">游戏安装</h2>${icon('folder')}</div><div class="meta">默认目录</div><div style="word-break:break-all;font-size:13px;margin:8px 0 14px">${escapeHtml(state.directory)}</div><button class="link" data-action="游戏目录">选择游戏目录 →</button></section></div><section class="b-card b-full"><div class="row space"><h2 class="section-title">常用功能</h2><span class="small muted">后续阶段的入口示意</span></div><div class="b-module-grid"><button class="b-module" data-action="签到">${icon('gift')}<strong>每日签到</strong><span>当前：${state.sign}</span></button><button class="b-module" data-action="祈愿记录">${icon('chart')}<strong>祈愿记录</strong><span>按游戏 UID 查看</span></button><button class="b-module" data-action="养成计划">${icon('spark')}<strong>养成计划</strong><span>规划材料需求</span></button></div></section></div></div></div>`}
  function variantC(){return `<div class="app variant-c"><header class="c-header"><div class="c-brand">✦ Genshin-Go</div><nav class="c-nav" aria-label="主导航"><button class="active" data-action="首页">旅途</button><button data-action="祈愿记录">资料</button><button data-action="账号">账号</button><button data-action="设置">设置</button></nav><button class="ghost c-profile" data-action="账号">${icon('user')} ${escapeHtml(state.account)}</button></header><div class="c-layout"><section class="c-feature"><span class="eyebrow c-kicker">YOUR JOURNEY, ONE PLACE</span><h1>下一段旅途，<br>从容启程。</h1><p>游戏启动、账号与本地资料聚合在同一个工作台。左侧保留启程的仪式感，右侧集中呈现当前需要处理的事。</p><button class="primary" data-action="启动">${icon('play')} 普通启动游戏</button><div class="c-preview"><div><strong>01</strong><span class="small">当前账号</span></div><div><strong>01</strong><span class="small">已选目录</span></div><div><strong>${state.sign==='已签到'?'✓':'—'}</strong><span class="small">今日签到</span></div></div></section><section class="c-desk"><div><div class="eyebrow c-kicker">TODAY'S DESK</div><h2>今日工作台</h2></div><section class="c-tile"><div class="c-row"><h3>启动准备</h3><span class="pill" style="background:#e1f4e9;color:#368064"><i class="dot"></i> 路径已选</span></div><div class="c-steps"><div class="c-step active"><strong>01 选择目录</strong>国服官服安装</div><div class="c-step active"><strong>02 选择账号</strong>${escapeHtml(state.account)}</div><div class="c-step"><strong>03 启动游戏</strong>普通启动</div></div><div class="c-row" style="margin-top:15px"><p style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(state.directory)}</p><button class="ghost" data-action="游戏目录">更换目录</button></div></section><section class="c-tile"><div class="c-row"><h3>今日签到</h3><span class="small muted">指定账号：${escapeHtml(state.account)}</span></div><p>状态：${state.sign}。原型中的签到按钮只更新演示状态。</p><div style="margin-top:16px"><button class="primary" data-action="签到">${state.sign==='已签到'?'今日已签到':'模拟签到'}</button></div></section><section class="c-tile"><h3>资料与计划</h3><ul class="c-list"><li><span>祈愿记录</span><span>按 UID 浏览 →</span></li><li><span>成就进度</span><span>手动标记 →</span></li><li><span>养成计划</span><span>材料需求 →</span></li></ul></section></section></div></div>`}
  function modal(){if(!state.modal)return '';const account=state.modal==='account';return `<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="row space"><h2 id="modal-title">${account?'账号管理':'选择游戏目录'}</h2><button class="text-button" data-close aria-label="关闭">关闭</button></div>${account?`<p>当前账号：${escapeHtml(state.account)}。扫码授权属于正式应用功能；此处仅演示界面操作。</p><div class="row"><button class="primary" data-modal-action="switch">切换演示账号</button><button class="ghost" data-modal-action="qr">扫码添加账号</button></div>`:`<p>选择已安装的国服官服游戏目录。输入路径仅更新原型显示，不会访问文件系统。</p><input id="directory-input" aria-label="游戏目录" value="${escapeHtml(state.directory)}"><div class="row"><button class="primary" data-modal-action="save">使用此目录</button><button class="ghost" data-close>取消</button></div>`}</div></div>`}
  function render(){document.getElementById('root').innerHTML=(state.variant==='A'?variantA():state.variant==='B'?variantB():variantC())+`<div class="switcher" aria-label="原型方案切换"><button data-cycle="-1" aria-label="上一个方案">‹</button><div><div class="switch-label">${state.variant} · ${variants[state.variant]}</div><div class="state-line">账号 ${escapeHtml(state.account)} · 签到 ${state.sign}</div></div><button data-cycle="1" aria-label="下一个方案">›</button><span class="prototype-tag">UI 原型</span></div>`+(state.message?`<div class="toast" role="status">${escapeHtml(state.message)}</div>`:'')+modal()}
  document.addEventListener('click',(event)=>{const target=event.target.closest('button');if(!target)return;if(target.hasAttribute('data-cycle')){cycle(Number(target.dataset.cycle));return}if(target.hasAttribute('data-close')){state.modal='';render();return}if(target.dataset.modalAction){if(target.dataset.modalAction==='switch'){state.account=state.account==='旅行者 01'?'旅行者 02':'旅行者 01';state.modal='';notify(`已切换到演示账号：${state.account}`)}else if(target.dataset.modalAction==='qr'){state.modal='';notify('扫码添加米哈游账号：正式应用已有入口，此处仅展示布局')}else if(target.dataset.modalAction==='save'){state.directory=document.getElementById('directory-input').value.trim()||state.directory;state.modal='';notify('演示目录已更新')}return}if(target.dataset.action)action(target.dataset.action)});
  document.addEventListener('keydown',(event)=>{if(event.key==='Escape'&&state.modal){state.modal='';render();return}if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;if(event.key==='ArrowLeft')cycle(-1);if(event.key==='ArrowRight')cycle(1)});
  render();
  </script>
</body>
</html>

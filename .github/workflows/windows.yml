name: Windows checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust checks
        run: rustup component add clippy rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Check workspace lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test issue synchronization offline
        run: ./docs/specs/test-launcher-ticket-sync.ps1
      - name: Install NSH 0.4.0
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nsh-windows.zip'
          Invoke-WebRequest https://github.com/longbridge/nsh/releases/download/v0.4.0/nsh-windows-x86_64.zip -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne 'e4cc3893700a1fcceb974c73ef8e08bc94a47a7a85c96d797d49c16dde95dff3') { throw 'NSH checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          $bin = Join-Path $env:RUNNER_TEMP 'nsh/bin'
          & (Join-Path $bin 'nsh.exe') --version
          $bin >> $env:GITHUB_PATH
      - name: Check application
        run: nsh check
      - name: Test application
        run: nsh test
      - name: Check interaction fixture
        working-directory: tests/.fixture
        run: nsh check
      - name: Test interaction fixture
        working-directory: tests/.fixture
        run: nsh test
